<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DimeDice — Premium Dice Roller</title>
    <meta
        name="description"
        content="DimeDice is a premium, customizable web-based dice roller with tactile animations and a dark, modern design."
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background-glow"></div>

    <header class="site-header">
        <a href="index.html" class="logo">
            <span>Dime</span><strong>Dice</strong>
        </a>

        <nav class="main-nav">
            <a href="index.html" class="active">Home</a>
            <a href="about.html">About</a>
        </nav>

        <button
            id="sound-toggle"
            class="sound-toggle"
            type="button"
            aria-label="Toggle sound"
            title="Toggle sound"
        >
            <span class="material-symbols-outlined">volume_off</span>
        </button>
    </header>

    <main class="app">

        <!-- Dice Area -->
        <section class="dice-section">

            <div class="dice-header">
                <div>
                    <span class="eyebrow">DICE ROLLER</span>
                    <h1>Roll your dice.</h1>
                </div>

                <span id="dice-type-label" class="dice-type-label">
                    HEXAHEDRON · D6
                </span>
            </div>

            <div id="dice-stage" class="dice-stage">
                <!-- Dice are generated by JavaScript -->
            </div>

            <div class="result-panel">
                <div id="result-formula" class="result-formula">
                    5 + 6 + 2
                </div>

                <div class="result-total-label">TOTAL</div>

                <div id="result-total" class="result-total">
                    13
                </div>
            </div>

            <button id="roll-button" class="roll-button" type="button">
                <span id="roll-label">ROLL</span>
            </button>

            <div class="roll-helper">
                SPACEBAR TO ROLL
            </div>

        </section>

        <!-- Controls -->
        <aside class="controls-section">

            <div class="control-group">
                <div class="control-label-row">
                    <span class="control-label">NUMBER OF DICE</span>
                    <span id="dice-count-value" class="control-value">3</span>
                </div>

                <div class="stepper">
                    <button
                        id="decrease-dice"
                        type="button"
                        aria-label="Decrease number of dice"
                    >
                        −
                    </button>

                    <span id="dice-count-display">3</span>

                    <button
                        id="increase-dice"
                        type="button"
                        aria-label="Increase number of dice"
                    >
                        +
                    </button>
                </div>
            </div>

            <div class="control-group">
                <div class="control-label">
                    NUMBER OF FACES
                </div>

                <div class="face-selector">

                    <button type="button" data-sides="4">
                        D4
                    </button>

                    <button
                        type="button"
                        data-sides="6"
                        class="selected"
                    >
                        D6
                    </button>

                    <button type="button" data-sides="8">
                        D8
                    </button>

                    <button type="button" data-sides="10">
                        D10
                    </button>

                    <button type="button" data-sides="12">
                        D12
                    </button>

                    <button type="button" data-sides="20">
                        D20
                    </button>

                </div>
            </div>

            <!-- History -->
            <div class="history-section">

                <div class="history-header">
                    <div>
                        <span class="eyebrow">ROLL HISTORY</span>
                    </div>

                    <button id="clear-history" type="button">
                        CLEAR
                    </button>
                </div>

                <div id="history-list" class="history-list">
                    <!-- Generated by JavaScript -->
                </div>

            </div>

        </aside>

    </main>

    <script src="script.js"></script>
</body>
</html>
